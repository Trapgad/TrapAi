<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TRAP AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <div class="brand">
                <div class="logo">T</div>
                <span>TRAP AI</span>
            </div>

            <button class="new-chat" id="newChat">
                <span>＋</span>
                New chat
            </button>

            <div class="history">

                <div class="history-title">
                    Recent chats
                </div>

                <div id="chatHistory"></div>

            </div>

            <div class="sidebar-bottom">

                <button class="sidebar-button">
                    ⚙️ Settings
                </button>

                <div class="profile">

                    <div class="avatar">
                        T
                    </div>

                    <div>
                        <strong>TRAP GAD</strong>
                        <small>TRAP AI</small>
                    </div>

                </div>

            </div>

        </aside>


        <!-- MAIN -->
        <main class="main">

            <!-- TOP BAR -->
            <header class="topbar">

                <button class="menu-button" id="menuButton">
                    ☰
                </button>

                <div class="mobile-title">
                    TRAP AI
                </div>

                <button class="mobile-new-chat" id="mobileNewChat">
                    ＋
                </button>

            </header>


            <!-- CHAT -->
            <section class="chat-area" id="chatArea">

                <!-- WELCOME -->
                <div class="welcome" id="welcome">

                    <div class="welcome-logo">
                        T
                    </div>

                    <h1>
                        What can I help with?
                    </h1>

                    <p>
                        Welcome to TRAP AI.
                    </p>

                </div>


                <!-- MESSAGES -->
                <div class="messages" id="messages"></div>

            </section>


            <!-- MESSAGE COMPOSER -->
            <div class="composer-container">

                <div class="composer">

                    <button
                        class="composer-button"
                        id="attachButton"
                        type="button">
                        ＋
                    </button>

                    <textarea
                        id="messageInput"
                        placeholder="Message TRAP AI..."
                        rows="1">
                    </textarea>

                    <button
                        class="composer-button"
                        id="voiceButton"
                        type="button">
                        🎤
                    </button>

                    <button
                        class="send-button"
                        id="sendButton"
                        type="button">
                        ↑
                    </button>

                </div>

                <div class="disclaimer">
                    TRAP AI can make mistakes. Check important information.
                </div>

            </div>

        </main>

    </div>


    <script src="script.js"></script>

</body>
</html>
